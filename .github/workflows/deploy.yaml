name: Build and Push to Azure

# Trigger the pipeline automatically when code is pushed to the main branch
on:
  push:
    branches:
      - main
    paths:
      - '*.py'
      - 'Dockerfile'
      - 'requirements.txt'
  workflow_dispatch: # This line adds a button so you can trigger it manually in GitHub if needed

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    # 1. Download the latest code from the repository
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Set up Python and run tests
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies and Test
      run: |
        pip install --prefer-binary -r requirements_test.txt
        python test_pipeline.py

    # 3. Log in securely to Azure Container Registry
    - name: Log in to Azure Container Registry
      uses: azure/docker-login@v2
      with:
        login-server: ${{ secrets.ACR_LOGIN_SERVER }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    # 4. Build and Push the new Docker image using dynamic secrets
    - name: Build and Push Docker Image
      run: |
        docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/oslo-bors-pipeline:${{ github.sha }} .
        docker push ${{ secrets.ACR_LOGIN_SERVER }}/oslo-bors-pipeline:${{ github.sha }}

    # 5. Log in to Azure CLI using OpenID Connect
    - name: Log in to Azure via OIDC
      uses: azure/login@v1
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    # 6. Tell the Container App Job to use the newly pushed image
    - name: Update Container App Job
      uses: azure/cli@v1
      with:
        inlineScript: |
          az containerapp job update \
            --name oslo-bors-monthly-job-tf \
            --resource-group oslo-bors-terraform-rg \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/oslo-bors-pipeline:${{ github.sha }}