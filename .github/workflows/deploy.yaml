name: Build and Push to Azure

# Trigger the pipeline automatically when code is pushed to the main branch
on:
  push:
    branches:
      - main
  workflow_dispatch: # This line adds a button so you can trigger it manually in GitHub if needed

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # 1. Download the latest code from the repository
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Log in securely to Azure Container Registry
    - name: Log in to Azure Container Registry
      uses: azure/docker-login@v2
      with:
        login-server: osloborsacr.azurecr.io
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    # 3. Build and Push the new Docker image
    - name: Build and Push Docker Image
      run: |
        docker build -t osloborsacr.azurecr.io/oslo-bors-pipeline:v1 .
        docker push osloborsacr.azurecr.io/oslo-bors-pipeline:v1